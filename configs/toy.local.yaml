# Local integration job: the deterministic toy task through hosted or local
# Lightspeed. Steps 6 and 7 of "Path to the first run" in docs/next-steps.md.
#
# Schema: Harbor 0.22.0, harbor.models.job.config.JobConfig.
# Model chosen 2026-09-02 (not a dated snapshot: record the resolved id from
# provenance.json); api_kind is required because the local runtime exposes
# every OpenAI model over both API kinds. The
# `oracle` arm runs the task's solution without any model and proves the
# verifier; drop it once it passes.

job_name: toy-local
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1

environment:
  type: docker
  delete: true

tasks:
  - path: tasks/toy-file-write

agents:
  - name: oracle

  - import_path: lightspeed_harbor.agent:LightspeedAgent
    model_name: openai/gpt-5.6-terra
    kwargs:
      lightspeed_provider_id: openai
      profile_id: inline
      api_kind: openai:responses
      reasoning_effort: low
