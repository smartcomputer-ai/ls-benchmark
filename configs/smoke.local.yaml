# Paired smoke job on local Docker.
#
# Schema: Harbor 0.22.0, harbor.models.job.config.JobConfig.
# Runs once the placeholders are filled and the host settings in .env.example
# are exported. Structure is validated by tests/.
#
# Replace every <placeholder> before a run. Never use `latest` for Harbor,
# the dataset, the model, or the envd artifact.

job_name: smoke-local
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 2

retry:
  # Whole-trial retries are allowed only for an explicit infrastructure
  # allowlist, decided in slice 3. Until then, none.
  max_retries: 0

environment:
  type: docker
  delete: true

datasets:
  # Resolved by Harbor's default registry: laude-institute/terminal-bench-2 at
  # 69671fbaac6d67a7ef0dfec016cc38a64ef7a77c, prebuilt linux/amd64 images.
  - name: terminal-bench
    version: "2.0"
    # Smoke allowlist, chosen for integration coverage rather than score:
    # quick file edit (regex-log), output-heavy log processing
    # (log-summary-date-ranges), editing plus compile (polyglot-c-py),
    # long-running build (sqlite-with-gcov), background process control
    # (qemu-startup). Oracle preflight decides whether each stays.
    task_names:
      - regex-log
      - log-summary-date-ranges
      - polyglot-c-py
      - sqlite-with-gcov
      - qemu-startup

agents:
  - name: codex
    model_name: openai/<immutable-model-id>
    n_concurrent: 1
    kwargs:
      reasoning_effort: <effort>

  - import_path: lightspeed_harbor.agent:LightspeedAgent
    model_name: openai/<immutable-model-id>
    n_concurrent: 1
    kwargs:
      lightspeed_provider_id: <lightspeed-provider-id>
      profile_id: inline
      reasoning_effort: <effort>
    # Only the Lightspeed arm needs egress to the Lightspeed gateway.
    extra_allowed_hosts:
      - lightspeed-gateway.example
