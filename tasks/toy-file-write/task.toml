# Deterministic toy task for the adapter's local integration loop. The
# verifier checks one filesystem mutation, so a passing trial proves the whole
# chain: envd registration, hosted session, environment tools, Harbor verifier.
schema_version = "1.4"

[task]
name = "ls-benchmark/toy-file-write"
version = "1.0.0"
description = "Write one file with exact contents; verifies the envd/Lightspeed/Harbor loop."
keywords = ["smoke", "adapter"]
[[task.authors]]
name = "ls-benchmark"

[metadata]
difficulty = "trivial"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
